<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quadratic Solver & Grading System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f9fc;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        
        h1,
        h2 {
            text-align: center;
            color: #004aad;
        }
        
        section {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
        }
        
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        
        button {
            background-color: #004aad;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #003580;
        }
        
        .result {
            margin-top: 15px;
            font-weight: bold;
        }
        
        .error {
            color: red;
            margin-top: 5px;
        }
        
        .divider {
            border-top: 2px solid #ddd;
            margin: 40px 0;
        }
    </style>
</head>

<body>

    <h1>Quadratic Solver & Grading System</h1>
    <p style="text-align:center;">Developed by <strong>Juliet Mulenga</strong> – Mulungushi University</p>

    <section id="quadratic-section">
        <h2>Quadratic Equation Solver</h2>
        <label for="a">Coefficient a:</label>
        <input type="number" id="a" placeholder="Enter a" />

        <label for="b">Coefficient b:</label>
        <input type="number" id="b" placeholder="Enter b" />

        <label for="c">Coefficient c:</label>
        <input type="number" id="c" placeholder="Enter c" />

        <div class="error" id="quad-error"></div>

        <button onclick="solveQuadratic()">Compute</button>
        <button onclick="resetQuadratic()">Reset</button>

        <div class="result" id="quad-result"></div>
    </section>

    <div class="divider"></div>

    <section id="grading-section">
        <h2>Grading System</h2>
        <label for="score">Enter Score (0–100):</label>
        <input type="number" id="score" placeholder="Enter score" />

        <div class="error" id="grade-error"></div>

        <button onclick="computeGrade()">Compute Grade</button>
        <button onclick="resetGrade()">Reset</button>

        <div class="result" id="grade-result"></div>
    </section>

    <script>
        // Quadratic Solver Function
        function solveQuadratic() {
            const a = parseFloat(document.getElementById('a').value);
            const b = parseFloat(document.getElementById('b').value);
            const c = parseFloat(document.getElementById('c').value);
            const errorDiv = document.getElementById('quad-error');
            const resultDiv = document.getElementById('quad-result');

            errorDiv.textContent = '';
            resultDiv.textContent = '';

            if (isNaN(a) || isNaN(b) || isNaN(c)) {
                errorDiv.textContent = 'Please enter valid numeric values for a, b, and c.';
                return;
            }
            if (a === 0) {
                errorDiv.textContent = 'Coefficient a cannot be 0 (this would not be a quadratic equation).';
                return;
            }

            const D = b * b - 4 * a * c;
            let message = `Discriminant (D) = ${D.toFixed(2)}. `;

            if (D > 0) {
                const x1 = (-b + Math.sqrt(D)) / (2 * a);
                const x2 = (-b - Math.sqrt(D)) / (2 * a);
                message += `Two distinct real roots: x₁ = ${x1.toFixed(2)}, x₂ = ${x2.toFixed(2)}.`;
            } else if (D === 0) {
                const x = -b / (2 * a);
                message += `One real repeated root: x = ${x.toFixed(2)}.`;
            } else {
                const realPart = (-b / (2 * a)).toFixed(2);
                const imagPart = (Math.sqrt(-D) / (2 * a)).toFixed(2);
                message += `Two complex roots: ${realPart} ± ${imagPart}i.`;
            }

            resultDiv.textContent = message;
        }

        function resetQuadratic() {
            document.getElementById('a').value = '';
            document.getElementById('b').value = '';
            document.getElementById('c').value = '';
            document.getElementById('quad-result').textContent = '';
            document.getElementById('quad-error').textContent = '';
        }

        // Grading System Function
        function computeGrade() {
            const score = parseInt(document.getElementById('score').value);
            const errorDiv = document.getElementById('grade-error');
            const resultDiv = document.getElementById('grade-result');

            errorDiv.textContent = '';
            resultDiv.textContent = '';

            if (isNaN(score)) {
                errorDiv.textContent = 'Please enter a numeric score.';
                return;
            }
            if (score < 0 || score > 100) {
                errorDiv.textContent = 'Score must be between 0 and 100.';
                return;
            }

            let grade = '';
            if (score >= 85) grade = 'A+';
            else if (score >= 75) grade = 'A';
            else if (score >= 65) grade = 'B+';
            else if (score >= 60) grade = 'B';
            else if (score >= 55) grade = 'C+';
            else if (score >= 50) grade = 'C';
            else grade = 'D';

            resultDiv.textContent = `Score ${score} → Grade ${grade}`;
        }

        function resetGrade() {
            document.getElementById('score').value = '';
            document.getElementById('grade-result').textContent = '';
            document.getElementById('grade-error').textContent = '';
        }
    </script>
</body>

</html>
